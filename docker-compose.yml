version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: restobot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: restobot
      POSTGRES_PASSWORD: restobot123
      POSTGRES_DB: restobot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restobot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://restobot:restobot123@postgres:5432/restobot?schema=public"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "http://localhost:3000"
    restart: unless-stopped

volumes:
  pgdata:
