version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dental-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental123
      POSTGRES_DB: dental_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
